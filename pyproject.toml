
[project]
name = "triageguard-ai"
version = "0.1.0"
description = "Human-supervised agentic clinical triage research prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "mcp>=1,<2",
    "pydantic>=2",
    "ollama",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triageguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
